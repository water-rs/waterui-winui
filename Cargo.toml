[workspace]
resolver = "3"
members = [".", "tools/bindgen", "vendor/gpu-allocator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/waterui-winui"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "waterui-winui"
description = "Native WinUI 3 backend for WaterUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["waterui-graphics/gpu", "waterui-shape/gpu", "dep:windows"]
self-contained = ["dep:windows-reactor-setup"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.100"
windows-collections = { version = "0.100", features = ["std"] }
windows-future = "0.100"
windows-numerics = "0.100"
windows-reference = { version = "0.100", features = ["std"] }
windows-time = "0.100"
windows = { version = "0.62", optional = true, default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }
async-channel = "2"
waterui = { version = "0.5.0", default-features = false }
waterui-core = "0.5.0"
waterui-backend-core = { version = "0.5.0", default-features = false, features = [
    "widgets",
    "gestures",
] }
waterui-text = "0.5.0"
waterui-controls = "0.5.0"
waterui-form = "0.5.0"
waterui-layout = "0.5.0"
waterui-navigation = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-icon = "0.5.0"
waterui-shape = { version = "0.5.0", default-features = false }
waterui-video = "0.5.0"
waterui-locale = "0.5.0"
# `std` turns on `Url::from_file_path`/`to_file_path`, which the drag-and-drop
# bridge uses to convert `Files` payloads to and from `StorageFile`s.
waterui-url = { version = "0.5.0", features = ["std"] }
nami = "0.12"
jiff = "0.2"
executor-core = "0.7.1"
native-executor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

# The generation code lives in `build/bindgen.rs`, a module of `build.rs`,
# so these are ordinary build dependencies of this package — a `path`
# dependency on the `publish = false` tool would make `cargo publish` fail.
[build-dependencies]
sha2 = "0.10"
ureq = "3"
windows-bindgen = "0.100"
windows-default = "0.100"
windows-rdl = "0.100"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-reactor-setup = { version = "0.100", optional = true }

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }

# The third-party pins below are the framework's own `[patch.crates-io]` at the
# pinned revision: the git-pinned `waterui-*` crates declare the registry
# requirements, and a dependency's patch table does not apply downstream, so
# this table has to carry the same forks or the graph builds upstream code the
# framework deliberately avoids. The `xcb`/`block` forks the framework also
# pins are unreachable here — they sit behind webview/clipboard paths this
# backend's graph never resolves — and so is the `vello` family, which the
# Cherenkov-based `waterui-graphics` at this revision no longer names; an
# unused patch is a warning.
naga = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
naga-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-apple = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-emscripten = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-hal = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-naga-bridge = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
wgpu-types = { git = "https://github.com/water-rs/wgpu", rev = "4b35d8bc968f6968b3cbae65b6e2e2ee132aa038" }
shaderloom = { git = "https://github.com/water-rs/shaderloom", rev = "b0b6870c8b560d902c1de9a4d039c3a921b18b92" }
# suiteki 0.1.1 on crates.io implements nami-core 0.3's `Signal`; suiteki dev
# at the merge of water-rs/suiteki#27 implements 0.4's. Drop once a release
# carries it.
suiteki = { git = "https://github.com/water-rs/suiteki", rev = "7cf17bdba0e978d388a096b1916daebdc17253b4" }

# Migrated framework crates pinned to ec09f6473827a70c0f02d2d4b2fd273528611f44,
# the waterui `dev` revision whose patch table this one mirrors. Drop these
# entries once a release has the migration.
waterui = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "ec09f6473827a70c0f02d2d4b2fd273528611f44" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-clipboard = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "24ff906aaaaeccfee9b014760372140be0113266" }
