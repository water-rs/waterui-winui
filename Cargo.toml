[workspace]
resolver = "3"
members = [".", "tools/bindgen", "vendor/gpu-allocator"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/water-rs/waterui-winui"
rust-version = "1.95"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[package]
name = "waterui-winui"
description = "Native WinUI 3 backend for WaterUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["gpu"]
gpu = ["waterui-graphics/gpu", "waterui-shape/gpu"]
self-contained = ["dep:windows-reactor-setup"]

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.100"
windows-collections = { version = "0.100", features = ["std"] }
windows-future = "0.100"
windows-numerics = "0.100"
windows-reference = { version = "0.100", features = ["std"] }
windows-time = "0.100"
send_wrapper = "0.6"
waterui = { version = "0.5.0", default-features = false }
waterui-core = "0.5.0"
waterui-backend-core = { version = "0.5.0", default-features = false, features = [
    "widgets",
    "gestures",
] }
waterui-text = "0.5.0"
waterui-controls = "0.5.0"
waterui-form = "0.5.0"
waterui-layout = "0.5.0"
waterui-navigation = "0.5.0"
waterui-graphics = { version = "0.5.0", default-features = false }
waterui-icon = "0.5.0"
waterui-shape = { version = "0.5.0", default-features = false }
waterui-video = "0.5.0"
waterui-locale = "0.5.0"
# `std` turns on `Url::from_file_path`/`to_file_path`, which the drag-and-drop
# bridge uses to convert `Files` payloads to and from `StorageFile`s.
waterui-url = { version = "0.5.0", features = ["std"] }
# Pinned to =0.11.1 so the [patch.crates-io] nami below (nami#26,
# `Signal::get` -> `Signal::snapshot`) is the only nami in the graph.
nami = "=0.11.1"
jiff = "0.2"
executor-core = "0.7.1"
native-executor = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-reactor-setup = { version = "0.100", optional = true }

# Third-party forks the framework itself patches; a registry dependency does
# not carry its own patch table, so they are repeated here so this graph
# resolves the same sources as water-rs/waterui `dev`.
[patch.crates-io]
gpu-allocator = { path = "vendor/gpu-allocator" }

# The third-party pins below are the framework's own `[patch.crates-io]` at the
# pinned revision: the git-pinned `waterui-*` crates declare the registry
# requirements, and a dependency's patch table does not apply downstream, so
# this table has to carry the same forks or the graph builds upstream code the
# framework deliberately avoids. The `xcb`/`block` forks the framework also
# pins are unreachable here — they sit behind webview/clipboard paths this
# backend's graph never resolves, and an unused patch is a warning.
vello = { git = "https://github.com/lexoliu/vello", rev = "7f5e1ca5769a96dc4404b812e7fa0351499cd2c4" }
vello_hybrid = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_common = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
vello_sparse_shaders = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }
glifo = { git = "https://github.com/lexoliu/vello", rev = "a01e5039c290fa869e0f6f3708e621056740f49b" }

# Migrated framework crates pinned to the waterui dev head its own patch
# table carries: the registry 0.5.0 wave still reads signals through
# `Signal::get`, which nami#26 removed in favour of `snapshot`, so a registry
# copy beside the pinned nami would hold the pre-rename trait. Drop these
# entries once a release has the migration.
nami = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
nami-core = { git = "https://github.com/water-rs/nami", rev = "f1db5017f5d64cb45b9b304c74ff420377258476" }
waterui = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-backend-core = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-controls = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-core = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-form = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-graphics = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-icon = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-internal = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-layout = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-locale = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-macros = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-navigation = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-shape = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-text = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-url = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterui-video = { git = "https://github.com/water-rs/waterui", rev = "78c97eef4d70477977592f1ed717e65f0c8f9b37" }
waterkit-build = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-dialog = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
waterkit-fs = { git = "https://github.com/water-rs/waterkit", rev = "e5290913ee8adb22843fd60047f6a845f2391c5b" }
