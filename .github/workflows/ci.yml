name: CI

# WinUI 3 is Windows-only, so every leg runs on windows-latest. The smoke leg
# executes a real WinUI window against the self-contained Windows App Runtime
# staged by `windows-reactor-setup`; no installed runtime is assumed.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # `waterui-graphics` AOT-compiles WGSL to DXIL through shaderloom when the
      # `gpu` feature (on by default) is enabled for a Windows target.
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - run: cargo fmt --check
      # `--no-default-features` applies to every selected workspace member;
      # the vendored `gpu-allocator` (a member so consumers can git-pin it)
      # requires its default `std` feature, so it sits this leg out.
      - run: cargo check --locked --workspace --exclude gpu-allocator --no-default-features
      # `--all-targets` cannot cover the vendored member on any single host:
      # upstream's examples are platform-bound (`metal-buffer` links Apple
      # frameworks, `d3d12-buffer-winrs` the `windows` crate), so the member
      # gets a scoped leg for what a Windows host can build — its library,
      # its tests and the D3D12 example that exercises the vendored patch.
      - run: cargo check --locked --workspace --all-targets --exclude gpu-allocator
      - run: cargo check --locked -p gpu-allocator --lib --tests --example d3d12-buffer-winrs
      - run: cargo clippy --locked --workspace --all-targets --exclude gpu-allocator -- -D warnings
      - run: cargo clippy --locked -p gpu-allocator --lib --tests --example d3d12-buffer-winrs -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --locked --workspace --exclude gpu-allocator --no-tests warn
      - run: cargo test --locked --workspace --exclude gpu-allocator --doc

  msrv:
    name: windows-latest (msrv)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The floor is whatever `Cargo.toml` declares, read here rather than
      # written twice: a hardcoded version in CI drifts from the manifest and
      # then gates a number nobody declared.
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Installing a toolchain is not building with it: the action only
          # sets the rustup default, and this repository's
          # `rust-toolchain.toml` overrides the default for every cargo
          # invocation inside the checkout. `RUSTUP_TOOLCHAIN` is the one
          # override that beats the file.
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      # Proof in the log that the floor is what compiled, so a later change to
      # the pin or the action cannot quietly make this a second stable run.
      - name: Show the toolchain this job builds with
        run: rustc --version && cargo --version
      # The shipped artifact is what MSRV bounds: dev-dependencies may
      # legitimately require newer, so check the package targets only. The
      # vendored `gpu-allocator` member carries its own lower `rust-version`,
      # so it sits this leg out exactly as in the check job.
      - run: cargo check --locked --workspace --exclude gpu-allocator

  smoke:
    name: windows-latest (smoke)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      # `self-contained` stages the Windows App Runtime DLLs into
      # `target/debug`, adjacent to the bin targets.
      - run: cargo build --locked --bins --features self-contained
      - name: Run smoke window
        run: .\target\debug\smoke.exe
        timeout-minutes: 10
      - name: Screenshot form example
        run: tools\capture-window.ps1 -Exe .\target\debug\form.exe -OutPrefix form -IncludeDesktop
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        with:
          name: form-example
          path: form-*.png
          if-no-files-found: error

  # A release is a merge into `main`, and `main` only accepts `dev`. The
  # nightly is the only run of the example e2e suite, so a `dev` it has not
  # passed must not be released: this check requires the newest completed
  # nightly run at the pull request's head commit — scheduled or dispatched,
  # the inputs are the same — to have succeeded. A red or cancelled run, or
  # no run at all because `dev` moved since the last one, fails the check
  # with the run to look at or the dispatch to make. Only `main` is gated;
  # fixes land on `dev` through pull requests this check never sees.
  # This backend is experimental: its nightly is informational, like a bench
  # leg, and never gates a release (waterui AGENTS.md, "Experimental backends
  # never gate a release"). The job keeps its name so the main ruleset's
  # required context is satisfied, reports the nightly's state as an
  # annotation, and always succeeds; a red nightly becomes an issue here.
  nightly-healthy:
    name: Nightly healthy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Report the nightly at the head commit
        run: |
          set -euo pipefail
          run="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/nightly.yml/runs?head_sha=${HEAD_SHA}&status=completed&per_page=1" \
            --jq 'if (.workflow_runs | length) == 0 then "" else .workflow_runs[0] | .conclusion + " " + .html_url end')"
          if [ -z "${run}" ]; then
            echo "::warning::no completed nightly run exists at ${HEAD_SHA}; this backend is experimental, so the release proceeds without one"
          elif [ "${run%% *}" != "success" ]; then
            echo "::warning::the newest nightly run at ${HEAD_SHA} concluded '${run%% *}' (${run#* }); this backend is experimental, so the release proceeds — file the failure as an issue"
          else
            echo "nightly at ${HEAD_SHA} is green: ${run#* }"
          fi
