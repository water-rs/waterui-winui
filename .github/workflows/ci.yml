name: CI

# WinUI 3 is Windows-only, so every leg runs on windows-latest. The smoke leg
# executes a real WinUI window against the self-contained Windows App Runtime
# staged by `windows-reactor-setup`; no installed runtime is assumed.

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # `waterui-graphics` AOT-compiles WGSL to DXIL through shaderloom when the
      # `gpu` feature (on by default) is enabled for a Windows target.
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      - run: cargo fmt --check
      - run: cargo check --locked --workspace --no-default-features
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  smoke:
    name: windows-latest (smoke)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install DirectX Shader Compiler
        uses: tracel-ai/github-actions/install-dxc@295f2fdbae5271f4f8ad56d634e4ff6a95daafc8
      # `self-contained` stages the Windows App Runtime DLLs into
      # `target/debug`, adjacent to the bin targets.
      - run: cargo build --locked --bins --features self-contained
      - name: Run smoke window
        run: .\target\debug\smoke.exe
        timeout-minutes: 10
      - name: Screenshot form example
        run: tools\screenshot-form.ps1
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        with:
          name: form-example
          path: form-*.png
          if-no-files-found: error
